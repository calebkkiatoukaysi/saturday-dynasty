.gm-h span { color: var(--ink-3); font-weight: 600; font-size: 12px; }
.gm-list { display: flex; flex-direction: column; margin-inline: calc(-1 * var(--s2)); }
.gm-list > :nth-child(odd) { background: var(--surface); }
.gm-list > :nth-child(even) { background: var(--surface-2); }
.gm-r { display: grid; grid-template-columns: 34px auto minmax(0, 1fr) auto 56px 14px; align-items: center; gap: 8px; padding: 8px var(--s2); min-height: 70px; width: 100%; text-align: left; }
.gm-pos { display: flex; flex-direction: column; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.gm-pos b { font-size: 14px; font-weight: 700; color: var(--ink); }
.gm-pos small { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.gm-m { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.gm-n { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gm-s { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gm-k { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gm-o { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #8E2A3A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1; font-variant-numeric: tabular-nums; }
.gm-o small { font-size: 8.5px; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 700; }
.gm-o b { font-size: 17px; font-weight: 800; }
.gm-o.g { border-color: #2E9E5B; }
.gm-o.y { border-color: #C9A227; }
.gm-tr { font-style: normal; font-size: 11px; color: transparent; text-align: center; }
.gm-tr.up { color: var(--win); }
.gm-tr.one { opacity: 0.6; }
.gm-tr.dn { color: var(--loss); }
.gm-foot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gm-go { background: #2E9E5B; color: #fff; border-color: transparent; min-height: 50px; font-size: 14px; letter-spacing: 0.06em; }
.sch { display: flex; flex-direction: column; margin-inline: calc(-1 * var(--s2)); }
.sch-h, .sch-r { display: grid; grid-template-columns: 56px minmax(0, 1fr) 118px; align-items: center; gap: 8px; padding: 0 var(--s2); }
.sch-h { min-height: 44px; font-size: 13px; letter-spacing: 0.06em; font-weight: 700; color: var(--ink-2); }
.sch-h span:last-child { text-align: center; }
.sch-r { min-height: 56px; width: 100%; text-align: left; font-size: var(--fs-md); }
.sch-r:nth-child(even) { background: var(--surface); }
.sch-r:nth-child(odd) { background: var(--surface-2); }
.sch-r.bye { color: var(--ink-3); }
.sch-note { grid-column: 2 / -1; margin: -10px 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sch-note.riv { color: var(--danger, #EF4444); }
.sch-w { font-weight: 600; color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.sch-t { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.sch-t b { font-weight: 700; white-space: nowrap; }
.sch-t b small { font-size: 11px; color: var(--ink-3); }
.sch-at { color: var(--ink-2); font-weight: 600; }
.sch-rec { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.sch-s { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.sch-s i { font-style: normal; width: 50px; height: 38px; display: grid; place-items: center; background: var(--sunk); border-radius: 4px; color: var(--ink); }
.sch-r.w .sch-s i:first-child { background: color-mix(in srgb, var(--win) 28%, var(--sunk)); color: var(--win); }
.sch-r.l .sch-s i:first-child { background: color-mix(in srgb, var(--loss) 25%, var(--sunk)); color: var(--loss); }
.sel-row.one { grid-template-columns: minmax(0, 1fr); }

/* ---------- schedule ---------- */
.sched { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: var(--s1); padding: 10px 0; border-bottom: 1px solid var(--rule); min-height: 54px; width: 100%; }
.sched.bye { grid-template-columns: 32px minmax(0, 1fr); color: var(--ink-3); }
.sched-w { font-weight: 800; color: var(--ink-3); font-size: var(--fs-xs); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sched-m { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: nowrap; }
.sched-m .row-s { flex: none; }
.sched-e { display: flex; align-items: center; gap: 6px; justify-self: end; }
.where { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; width: 16px; flex: none; }
.tc { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.tc-n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tc.you .tc-n { color: var(--accent); }

.res { font-weight: 800; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.res.w { color: var(--win); }
.res.l { color: var(--loss); }
.res.pending { color: var(--ink-3); font-weight: 600; }
.sb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--s1); }
.sb { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 12px; width: 100%; box-shadow: var(--shadow); }
.list .sb { border-radius: 0; border-width: 0 0 1px; padding-inline: 0; background: transparent; box-shadow: none; }
.sb-t { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s1); color: var(--ink-2); border-radius: 6px; }
.sb-t.won { color: var(--ink); }
.sb-t.won .sb-s { color: var(--ink); }
.sb-n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-s { font-size: var(--fs-lg); font-weight: 800; color: var(--ink-3); min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.sb-st, .sb-name { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- team ---------- */
.ratings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s1); }
.ratings > div { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--s2); border-top: 1px solid var(--rule); }
.kv-i { display: flex; justify-content: space-between; gap: var(--s1); padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: var(--fs-sm); min-width: 0; }
.kv-i span { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv-i b { text-align: right; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.kv-i.wide { grid-column: 1 / -1; }
.ts-h { display: flex; gap: 12px; align-items: center; }

/* tables: scroll inside their container, never the page */
.tbl-wrap { overflow-x: auto; margin-inline: calc(-1 * var(--s2)); padding-inline: var(--s2); -webkit-overflow-scrolling: touch; max-width: calc(100% + 2 * var(--s2)); overscroll-behavior-x: contain; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.tbl th button { font-weight: 800; letter-spacing: inherit; text-transform: inherit; min-height: 36px; white-space: nowrap; }
.tbl th.on { color: var(--accent); }
.tbl td { padding: 9px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.tbl .num { text-align: right; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.tbl th.num { text-align: right; color: var(--ink-3); }
.tbl .sticky { position: sticky; left: 0; background: var(--bg); z-index: 1; padding-left: 0; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; box-shadow: 1px 0 0 var(--rule); }
.tbl tr[data-act] { cursor: pointer; }
.tbl .hl .sticky { background: color-mix(in srgb, var(--accent) 9%, var(--bg)); }
.tbl.line td, .tbl.line th { text-align: center; }
/* Even tables: fixed layout, equal number columns, at least the card's width. */
.tbl.even { table-layout: fixed; min-width: 100%; }
.tbl.even th, .tbl.even td { overflow: hidden; text-overflow: ellipsis; }
.tbl.even .sticky { max-width: none; }
.tbl.even th.num, .tbl.even td.num { padding-inline: 4px; }
.tbl.even tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.tbl.even tbody tr:nth-child(even) td.sticky { background: color-mix(in srgb, var(--surface) 55%, var(--bg)); }

.sheet-body .tbl .sticky { background: var(--bg); }

/* ---------- recruiting ---------- */
.rhead { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s1); }
.rhead-i { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.rhead-i b { font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rhead-i.nil-i { grid-column: 1 / -1; }
.rhead-i.nil-i b .muted { font-size: 13px; font-weight: 600; }
.bar.nil .bar-fill { background: var(--gold); }
.nil-v { color: var(--gold); font-weight: 700; white-space: nowrap; }
.qa.nil-qa { border-color: color-mix(in srgb, var(--gold) 55%, var(--rule)); color: var(--gold); }
.qa.nil-qa.on { background: color-mix(in srgb, var(--gold) 16%, var(--surface)); }
.nil-hi { color: var(--gold); }
.nil-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.nil-b { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 2px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); text-align: center; min-width: 0; }
.nil-b b { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nil-b span { font-size: 10px; color: var(--ink-2); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.nil-b.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); box-shadow: inset 0 0 0 1px var(--gold); }
.nil-b:disabled { opacity: 0.45; }
.nil-b.on:disabled { opacity: 1; }
.nil-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s1); font-size: var(--fs-xs); flex-wrap: wrap; }
.rlist { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; border-bottom: 1px solid var(--rule); }
.rrow .row { border-bottom: 0; }
.mini { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--rule); font-size: 18px; font-weight: 700; color: var(--ink-2); display: grid; place-items: center; flex: none; }
.mini.on { background: var(--accent); color: var(--accent-on); border-color: transparent; font-size: 15px; }
.rcard { border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.rcard .row { border-bottom: 0; }
.qa-row { display: flex; gap: 6px; flex-wrap: wrap; padding-left: 52px; }
.qa { min-height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--rule); font-size: var(--fs-xs); font-weight: 700; background: var(--surface); white-space: nowrap; }
.qa-note { font-size: var(--fs-xs); color: var(--win); font-weight: 700; align-self: center; padding: 0 4px; }
.rstat { font-size: var(--fs-xs); color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; }
.rstat.mine { color: var(--win); }
.rstat.gone { color: var(--ink-3); }
.pipe-st { width: 40px; font-weight: 800; color: var(--ink-3); text-align: center; flex: none; }
.pipe-v { width: 100px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1); align-items: center; flex: none; }
.ibars { display: flex; flex-direction: column; gap: var(--s1); }
.ibar { display: grid; grid-template-columns: auto minmax(0, 1fr) 30% 40px; gap: var(--s1); align-items: center; font-size: var(--fs-sm); }
.ibar-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibar.me .ibar-n { font-weight: 800; color: var(--accent); }
.ibar b { text-align: right; }
.act-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s1); }
.act-b { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); min-height: 62px; min-width: 0; }
.act-b.done { background: color-mix(in srgb, var(--win) 10%, var(--surface)); }
.act-t { font-weight: 800; font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-s { font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.3; }

/* ---------- league ---------- */
.poll-r { display: grid; grid-template-columns: 26px auto minmax(0, 1fr) auto 36px; align-items: center; gap: var(--s1); padding: 9px 0; border-bottom: 1px solid var(--rule); width: 100%; min-height: 54px; }
.poll-n { font-size: var(--fs-md); font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.poll-p { font-weight: 700; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.mv { font-size: 11px; font-weight: 800; color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mv.up { color: var(--win); }
.mv.down { color: var(--loss); }
.mv.new { color: var(--info); }
.seeds { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.seed { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; font-weight: 700; font-size: 13px; min-width: 0; }
.seed .tabular { white-space: nowrap; }
.seed .tag { margin-left: auto; }
.bracket { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(196px, 1fr); gap: 12px; overflow-x: auto; margin-inline: calc(-1 * var(--s2)); padding: 4px var(--s2) var(--s1); -webkit-overflow-scrolling: touch; }

.bk-h { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 800; }
.bk-g { display: flex; flex-direction: column; gap: 3px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; width: 100%; text-align: left; }
.bk-l { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-t { display: grid; grid-template-columns: 18px auto minmax(0, 1fr) auto; gap: 6px; align-items: center; color: var(--ink-2); font-size: var(--fs-sm); min-height: 24px; }
.bk-t.won { color: var(--ink); font-weight: 800; }
.bk-t.me .bk-n { color: var(--accent); }
.bk-t.tbd { grid-template-columns: 18px minmax(0, 1fr); }
.bk-seed { font-size: 11px; font-weight: 800; color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; }
.bk-n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bk-s { font-weight: 800; font-size: var(--fs-md); font-variant-numeric: tabular-nums; }
.hist { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.hist-y { font-size: var(--fs-md); font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.honors { margin: 0; padding-left: 18px; font-size: var(--fs-sm); line-height: 1.6; }

/* ---------- sheets ---------- */
#sheet-host { position: fixed; inset: 0; z-index: 50; }
.sheet-back { position: absolute; inset: 0; background: var(--overlay); animation: fade 0.18s ease-out; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px));
  margin: 0 auto; max-width: 680px; background: var(--bg); border-radius: 18px 18px 0 0;
  display: flex; flex-direction: column; animation: rise 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 -8px 30px rgb(0 0 0 / 0.25);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0; flex: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); }
.sheet-body > * { flex-shrink: 0; }
.sheet-body { overflow-y: auto; overflow-x: hidden; padding: 4px var(--s2) calc(var(--s3) + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: var(--s2); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet-title { font-size: var(--fs-lg); font-weight: 800; line-height: 1.2; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.sheet-actions { display: flex; gap: var(--s1); flex-wrap: wrap; }
.sheet-foot { display: flex; gap: var(--s1); justify-content: flex-end; padding-top: 4px; flex-wrap: wrap; }
.sticky-foot { position: sticky; bottom: calc(-1 * var(--s3) - env(safe-area-inset-bottom, 0px)); background: var(--bg); padding-block: 10px; border-top: 1px solid var(--rule); z-index: 2; }
.ph { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.ph-m { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13px; }
.ph-m p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-o { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ph-o .ovr { min-width: 52px; height: 44px; font-size: var(--fs-lg); border-radius: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags .tag { margin: 0; }
.attrs { display: flex; flex-direction: column; gap: 7px; }
.attr { display: grid; grid-template-columns: 112px minmax(0, 1fr) 26px; gap: 10px; align-items: center; font-size: 13px; }
.attr-l { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attr b { text-align: right; }
.more-attrs summary { cursor: pointer; font-weight: 700; color: var(--accent); padding: 8px 0; font-size: var(--fs-sm); list-style: none; }
.more-attrs summary::-webkit-details-marker { display: none; }
.more-attrs summary::after { content: ' ▾'; font-size: 11px; }
.more-attrs[open] summary::after { content: ' ▴'; }
.attr-grp { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--ink-3); margin: 10px 0 2px; }
.statline { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; }
.sl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.sl-grid div { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.sl-grid span { font-size: 10px; letter-spacing: 0.05em; color: var(--ink-3); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl-grid b { font-size: var(--fs-md); white-space: nowrap; }
.gc { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--s1); }
.gc-t { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.gc-n { font-weight: 800; font-size: var(--fs-sm); line-height: 1.2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-at { color: var(--ink-3); font-weight: 700; font-size: 13px; }
.cmp { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.cmp-h, .cmp-r { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px; gap: var(--s1); padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: var(--fs-sm); }
.cmp-h b, .cmp-r b { text-align: right; white-space: nowrap; }
.cmp-h b { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); }
.cmp-r span { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box-h { font-size: var(--fs-xs); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--ink-2); margin-top: 6px; }
.scoring, .pbp { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.scoring li { display: grid; grid-template-columns: 62px 40px minmax(0, 1fr) auto; gap: var(--s1); padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 13px; align-items: baseline; }
.sc-q { color: var(--ink-3); font-weight: 700; font-size: 11px; white-space: nowrap; }
.sc-t { font-weight: 800; }
.sc-x { min-width: 0; line-height: 1.35; }
.sc-s { font-weight: 800; white-space: nowrap; }
.pbp-q { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--ink-2); padding: 12px 0 6px; border-bottom: 1px solid var(--rule); }
.pbp-n { color: var(--ink-3); font-size: var(--fs-xs); padding: 6px 0; border-bottom: 1px solid var(--rule); font-style: italic; }
.pbp-r { display: grid; grid-template-columns: 36px 40px minmax(0, 1fr); gap: var(--s1); padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.pbp-r.big .pbp-x { font-weight: 800; }
.pbp-c { color: var(--ink-3); font-size: 11px; white-space: nowrap; }
.pbp-p { font-weight: 800; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbp-x { min-width: 0; line-height: 1.4; overflow-wrap: anywhere; }

/* forms */
.edit { display: flex; flex-direction: column; gap: 14px; }
.edit-ovr { display: flex; align-items: center; gap: 10px; }
.ovr-big { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-xs); color: var(--ink-2); font-weight: 600; min-width: 0; }
.fld input, .fld select { width: 100%; }
.fld input[type="color"] { padding: 4px; height: 44px; }
.fld.wide { grid-column: 1 / -1; }
.sliders { display: flex; flex-direction: column; gap: 10px; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; font-size: var(--fs-sm); }
.slider output { font-weight: 800; font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }

/* ---------- new game ---------- */
.ng { max-width: 760px; margin: 0 auto; padding: calc(var(--s3) + env(safe-area-inset-top, 0px)) var(--s2) calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }

.ng-p { flex-direction: column; align-items: flex-end; gap: 0; font-size: var(--fs-xs); }
.ng-go {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px var(--s2) calc(10px + env(safe-area-inset-bottom, 0px));
}
.ng-pick { display: inline-flex; align-items: center; gap: var(--s1); min-width: 0; overflow: hidden; white-space: nowrap; flex: 1; }
.ng-go .btn { flex: none; }

/* ---------- coach ---------- */

.coach-hero { display: flex; gap: 12px; align-items: center; margin-top: var(--s3, 24px); }
.coach-hero-img { width: 96px; height: 96px; border-radius: 16px; flex: none; overflow: hidden; display: block; }
.coach-hero-tx { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
.coach-hero-tx .eyebrow { white-space: normal; overflow-wrap: anywhere; }
.coach-hero-tx .tag { margin: 0; }
.coach-yr { grid-template-columns: 48px minmax(0, 1fr); }
.watch-b { background: #0F1512; color: #fff; border-color: #0F1512; }

.cc { display: flex; flex-direction: column; gap: var(--s2); }
.cc-prev {
  position: relative; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; overflow: hidden;
  background: radial-gradient(120% 90% at 20% 0%, color-mix(in srgb, var(--c1) 70%, #fff) 0%, var(--c1) 55%, color-mix(in srgb, var(--c1) 60%, #000) 100%);
  color: #fff; min-height: 112px;
}
.cc-face { width: 84px; height: 84px; border-radius: 14px; overflow: hidden; flex: none; box-shadow: 0 6px 16px rgb(0 0 0 / 0.35); display: block; }
.cc-prev-tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-shadow: 0 1px 2px rgb(0 0 0 / 0.35); }
.cc-prev-tx .eyebrow { color: rgb(255 255 255 / 0.8); }
.cc-prev-tx b { font-size: var(--fs-lg); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; letter-spacing: -0.015em; }
.cc-prev-tx .muted { color: rgb(255 255 255 / 0.85); font-size: 13px; }
.fld.slider { display: flex; }
.fld.slider output { color: var(--ink); font-weight: 800; }
.fld.slider input { min-height: 44px; padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
.arch-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s1); }
.arch { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--rule); background: var(--surface); text-align: left; min-width: 0; }
.arch b { font-size: var(--fs-sm); }
.arch span { font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.35; }
.arch.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- coaching staff ---------- */
.staff { display: flex; flex-direction: column; gap: 6px; padding-block: 6px 10px; }
.staff .row { padding-inline: 0; min-height: 56px; }
.staff .note { padding-left: 46px; }
.staff-role { width: 38px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; color: var(--ink-2); flex: none; }
.staff.hc { border-bottom: 1px solid var(--rule); padding-bottom: 14px; margin-bottom: 4px; }
.staff-d, .staff-k { margin: 0; padding-left: 46px; font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.4; }
.staff-k { font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
.staff-d .tag { margin-right: 4px; }
.sch-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 46px; }
.sch-chip { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 44px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--surface); text-align: left; }
.sch-chip b { font-size: 12.5px; }
.sch-chip small { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
button.sch-chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); box-shadow: inset 0 0 0 1px var(--accent); }
button.sch-chip.on b { color: var(--accent); }
span.sch-chip { min-height: 0; border-color: transparent; background: color-mix(in srgb, var(--ink-3) 10%, var(--surface)); }
.scheme-now { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s1); margin-bottom: var(--s2); }
.scheme-now > div { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--rule); min-width: 0; }
.scheme-now b { font-size: var(--fs-sm); }
.scheme-now small { font-size: 11px; color: var(--ink-3); }
.cands-d { padding-left: 46px; }
.cands-d > summary { cursor: pointer; font-size: var(--fs-xs); font-weight: 800; color: var(--accent); min-height: 32px; display: flex; align-items: center; }
.cands { display: grid; grid-template-columns: 1fr; gap: 8px; }
.cand { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 10px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); min-width: 0; text-align: left; }
.cand-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cand-h b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.cand-h span { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.cand .ovr { min-width: 30px; height: 22px; font-size: 12px; }
.cand .staff-d, .cand .staff-k, .cand .sch-chips { padding-left: 0; }
.cand .btn { align-self: flex-start; }
.staff-card { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; text-align: left; width: 100%; }
.staff-card.open { border-color: color-mix(in srgb, var(--accent) 60%, var(--rule)); }
.staff-card-h { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 150px; }
.staff-card-h b { font-size: var(--fs-md, 16px); }
.staff-card-h .muted { font-size: var(--fs-xs); }
.staff-card-s { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 700; }
.staff-card-s small { display: inline-block; width: 30px; font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; }
.staff-card-cta { flex-basis: 100%; font-size: var(--fs-xs); font-weight: 800; color: var(--accent); }

/* ---------- studio (appearance + kit) ---------- */
.sheet-foot .grow { flex: 1; }
.tb.ts-helmet { width: 72px; height: 72px; border-radius: 14px; font-size: 19px; flex: none; box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--c2, #fff) 55%, transparent); }
.ts-h > div { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }

/* Coach monogram (coaches have no portrait) */
.mono { display: grid; place-items: center; width: 100%; height: 100%; font-weight: 800; letter-spacing: 0.02em; color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / 0.35); background: radial-gradient(120% 120% at 25% 10%, color-mix(in srgb, var(--c1, #26354F) 70%, #fff), var(--c1, #26354F) 55%, color-mix(in srgb, var(--c1, #26354F) 65%, #000)); box-shadow: inset 0 -4px 0 var(--c2, #C9A227); font-size: 18px; line-height: 1; }

.coach-hero-img .mono { font-size: 34px; box-shadow: none; }
.cc-face .mono { font-size: 32px; }
.slot-art .mono { font-size: 26px; background: transparent; box-shadow: none; }
.ng-coach .mono { font-size: 14px; background: color-mix(in srgb, var(--accent) 22%, var(--sunk)); color: var(--ink); box-shadow: none; text-shadow: none; }

/* ---------- title screen ---------- */
body.on-title { background: #05070B; }
.title-scr {
  min-height: 100vh; min-height: 100dvh; color: #EAF0EC; padding: 0 var(--s2) calc(var(--s3) + env(safe-area-inset-bottom, 0px));
  background: #05070B;
  display: flex; flex-direction: column; align-items: center; gap: var(--s3);
}
.title-hero { position: relative; width: 100vw; max-width: 100%; min-height: 300px; display: flex; align-items: flex-end; justify-content: center; margin-inline: calc(-1 * var(--s2)); overflow: hidden; }
.title-stadium { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.title-hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(transparent, #05070B); }
.title-hero-tx { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: calc(var(--s3) + env(safe-area-inset-top, 0px)) var(--s2) 18px; }
.title-ball { width: 64px; height: 40px; display: block; transform: rotate(-18deg); filter: drop-shadow(0 6px 10px rgb(0 0 0 / 0.6)); }
.title-ball svg { width: 100%; height: 100%; }
.title-logo { display: flex; flex-direction: column; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; text-shadow: 0 4px 24px rgb(0 0 0 / 0.7), 0 1px 2px rgb(0 0 0 / 0.6); }
.title-logo span:first-child { font-size: clamp(26px, 8vw, 40px); color: #fff; }
.title-logo span:last-child { font-size: clamp(44px, 14vw, 72px); color: #F0C04C; }
.title-tag { font-size: var(--fs-sm); color: #C9D2DC; text-shadow: 0 1px 3px rgb(0 0 0 / 0.8); }
.slots { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
.slot {
  --c1: #3B4A42; --c2: #8A968F;
  position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 4px 12px; align-items: center;
  padding: 14px; border-radius: 16px; background: rgb(255 255 255 / 0.055); border: 1px solid rgb(255 255 255 / 0.1);
  box-shadow: inset 4px 0 0 var(--c1); overflow: hidden;
}
.slot.empty { grid-template-columns: minmax(0, 1fr); border-style: dashed; box-shadow: none; background: rgb(255 255 255 / 0.03); }
.slot-art { width: 72px; height: 72px; border-radius: 14px; overflow: hidden; background: radial-gradient(100% 100% at 30% 10%, color-mix(in srgb, var(--c1) 70%, #fff), var(--c1) 60%, color-mix(in srgb, var(--c1) 60%, #000)); grid-row: span 2; align-self: start; }
.slot-m { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.slot-no { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: #8FA197; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-coach { font-weight: 800; font-size: var(--fs-md); line-height: 1.2; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-team { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--fs-sm); color: #DDE5E0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-s { font-size: var(--fs-xs); color: #A9B8AF; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-act, .slot-confirm { grid-column: 1 / -1; display: flex; gap: var(--s1); align-items: center; margin-top: var(--s1); flex-wrap: wrap; }
.slot:not(.empty) .slot-act { grid-column: 2; margin-top: 4px; }
.slot-act .btn.primary { flex: 1; background: #E7B84A; color: #1A1300; }
.slot-act .btn.ghost { color: #DDE5E0; border-color: rgb(255 255 255 / 0.2); }
.slot.empty .slot-act .btn { flex: 1; }
.slot-del { color: #A9B8AF; border: 1px solid rgb(255 255 255 / 0.14); }
.slot-del svg { width: 19px; height: 19px; }
.slot-confirm { font-size: 13px; color: #FFD2CC; }
.slot-confirm span { flex-basis: 100%; }
.slot-confirm .btn { flex: 1; }
.slot-confirm .btn.ghost { color: #fff; border-color: rgb(255 255 255 / 0.25); }
.title-msg { background: rgb(255 255 255 / 0.08); color: #EAF0EC; max-width: 560px; width: 100%; }
.title-foot { font-size: var(--fs-xs); color: #7F9187; text-align: center; max-width: 420px; }
.title-scr .boot { min-height: 200px; color: #A9B8AF; }

/* ---------- new dynasty wizard ---------- */
.wiz { gap: 18px; }
.wiz-h { display: flex; align-items: center; gap: var(--s1); margin-left: -8px; padding-bottom: 12px; border-bottom: 3px solid var(--ink); }
.wiz-ht { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wiz-t { font-size: clamp(22px, 6.5vw, 30px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
.ng-coach { width: 44px; height: 44px; border-radius: 50%; background: var(--sunk); flex: none; overflow: hidden; display: block; }
.ng-pick-tx { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
.ng-pick-tx b { font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ng-pick-tx span { display: inline-flex; gap: 5px; align-items: center; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- gamecast ---------- */
body.cx-open, body.rc-open { overflow: hidden; }
#cast-host { position: fixed; inset: 0; z-index: 45; background: #0A0C10; }
.cx {
  position: absolute; inset: 0; margin: 0 auto; max-width: 720px; display: flex; flex-direction: column;
  background: #0E1115; color: #E7ECE9; padding-top: env(safe-area-inset-top, 0px);
  --cx-card: #1A1E24; --cx-rule: #2A2F37; --cx-mute: #9AA3AD;
}
.cx.paused .gx-live { animation: none; opacity: 0.6; }

/* the scene: sky, stands, scoreboard, field */
.gx-scene { position: relative; flex: none; background: #0A0C10; overflow: hidden; }
.gx-sky { position: absolute; inset: 0; background: radial-gradient(60% 55% at 8% -10%, rgb(255 246 214 / 0.55) 0%, rgb(255 246 214 / 0.12) 40%, transparent 70%), linear-gradient(180deg, #0B1020 0%, #121A2E 55%, #0E1115 100%); }
.gx-stands { position: absolute; left: 0; right: 0; top: 118px; height: 54px; width: 100%; display: block; }
.gx-board {
  position: relative; z-index: 2; margin: 10px 14px 0; border: 5px solid #000; border-radius: 6px; overflow: hidden; background: #2B2F36;
  box-shadow: 0 10px 30px rgb(0 0 0 / 0.55);
}
.gx-row { display: grid; grid-template-columns: minmax(0, 1fr) 24px 74px; align-items: center; background: var(--c); color: var(--on); min-height: 44px; }
.gx-name { padding: 0 12px; font-size: 20px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gx-poss { width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0; justify-self: center; box-shadow: 0 0 0 2px rgb(0 0 0 / 0.25); }
.gx-poss.on { opacity: 1; }
.gx-sc { font-size: 24px; font-weight: 800; text-align: right; padding-right: 14px; font-variant-numeric: tabular-nums; background: rgb(0 0 0 / 0.22); align-self: stretch; display: grid; place-items: center end; }
.gx-sc.pop { animation: cx-pop 0.7s ease-out; }
.gx-foot { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; padding: 0 12px; background: #9A9EA4; color: #fff; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.gx-wp { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center; gap: 8px; min-height: 22px; padding: 0 10px; background: #1A1D22; color: #E7ECE9; font-size: 11px; font-weight: 800; letter-spacing: 0.03em; font-variant-numeric: tabular-nums; }
.gx-wp-l.r { text-align: right; }
.gx-wp-bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: #333; }
.gx-wp-bar i { display: block; height: 100%; transition: width 0.45s ease; }
.gx-wp-bar i:last-child { flex: 1; }
.gx-live { font-size: 10px; letter-spacing: 0.1em; color: #FFE14D; animation: cx-blink 1.4s ease-in-out infinite; }
.gx-live.final { animation: none; color: #fff; }
.gx-prog { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: #FFE14D; transition: width 0.4s ease; }
.gx-field { position: relative; margin-top: 6px; }
.gx-svg { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 360; max-height: 260px; }
#gx-trail g { transition: opacity 0.35s ease; }
.gx-num { font-weight: 800; font-size: 20px; fill: #fff; fill-opacity: 0.85; text-anchor: middle; dominant-baseline: central; }
.gx-ez { position: absolute; top: 8px; padding: 4px 10px; background: var(--c); color: var(--on); font-weight: 800; font-size: 14px; letter-spacing: 0.04em; border-radius: 2px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.4); }
.gx-ez.l { left: 10px; }
.gx-ez.r { right: 10px; }
#gx-los, #gx-fd { transition: opacity 0.2s; }

/* down and distance strip */
.gx-down { flex: none; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; background: #15251B; color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
.gx-downs { display: inline-flex; border: 1.5px solid #5A6E60; border-radius: 999px; padding: 2px; }
.gx-downs i { font-style: normal; width: 30px; height: 26px; display: grid; place-items: center; border-radius: 999px; color: #9FB3A6; font-size: 14px; }
.gx-downs i.on { background: #0E1115; color: #fff; box-shadow: inset 0 0 0 1.5px #fff; }
.gx-dist { white-space: nowrap; }
.gx-spot { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; min-width: 0; }

/* log cards */
.gx-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 8px 10px calc(96px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; background: #0E1115; }
.gx-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.gx-card { background: #1C2026; border-radius: 6px; overflow: hidden; box-shadow: inset 3px 0 0 var(--c, #2A2F37); animation: cx-in 0.3s ease-out; }
.gx-card-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; background: #262B32; font-size: 13px; font-weight: 700; color: #D8DEE5; font-variant-numeric: tabular-nums; }
.gx-card-h span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.gx-card-h span:last-child { white-space: nowrap; color: #C7CED6; }
.gx-card-b { display: grid; grid-template-columns: 78px minmax(0, 1fr) 84px; gap: 8px; align-items: center; padding: 10px 10px 8px; }
.gx-card-p { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.gx-card-p .av.sm { width: 48px; height: 48px; }
.gx-who { font-size: 11px; color: #C7CED6; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gx-card-x { font-size: 14px; line-height: 1.4; color: #EEF1F4; overflow-wrap: anywhere; }
.gx-card-r { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px; font-variant-numeric: tabular-nums; }
.gx-card-r b { font-size: 15px; font-weight: 800; }
.gx-card-r span { font-size: 12px; font-weight: 700; color: #C7CED6; letter-spacing: 0.02em; }
.gx-card-f { padding: 0 12px 10px; font-size: 12px; color: #B6BEC7; font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.gx-card.sc .gx-card-r b, .gx-card.sc .gx-card-r span { color: #FFE14D; }
.gx-card.big .gx-card-r span { color: #FCA5A5; }
.gx-card.note .gx-card-h { background: #1C2026; color: #FFE14D; }
.gx-card.inj .gx-card-x { color: #FDBA74; padding: 0 2px; }

/* bottom bar: transport + Log / Team / Player */
.gx-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: #1A1E24; border-top: 1px solid #2A2F37; }
.gx-ctrl { display: flex; align-items: center; gap: 6px; }
.gx-b { width: 44px; height: 44px; border-radius: 50%; background: #2A2F37; color: #DDE3E9; display: grid; place-items: center; }
.gx-b svg { width: 22px; height: 22px; }
.gx-pause { width: 50px; height: 50px; background: #B42B2B; color: #fff; }
.gx-b:disabled { opacity: .35; }
.gx-end { background: #233A2B; color: #CFE3D5; }
.gx-tabs { display: flex; background: #2A2F37; border-radius: 10px; padding: 3px; gap: 2px; min-width: 0; }
.gx-tab { flex: 1 1 0; min-width: 0; min-height: 40px; border-radius: 8px; font-weight: 700; font-size: 14px; color: #C7CED6; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gx-tab.on { background: var(--team); color: var(--on-team); }
.gx.over .gx-bar { grid-template-columns: 1fr; }
.gx.over .gx-scroll { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }

@media (max-width: 374px) {
  .gx-card-b { grid-template-columns: 64px minmax(0, 1fr) 72px; gap: 6px; }
  .gx-card-p .av.sm { width: 42px; height: 42px; }
  .gx-name { font-size: 17px; }
  .gx-sc { font-size: 21px; }
  .gx-bar { grid-template-columns: 1fr; gap: 6px; padding-top: 6px; }
  .gx-ctrl { justify-content: center; }
  .gx-b { width: 40px; height: 40px; }
  .gx-pause { width: 46px; height: 46px; }
  .gx-tab { font-size: 13px; min-height: 36px; }
  .gx-scroll { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  .gx.over .gx-scroll { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
  .cx-foot.gx-done { bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  .gx-down { font-size: 13px; gap: 6px; }
  .gx-downs i { width: 24px; }
}

.cx-banner {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
  padding: 8px 18px 9px; background: var(--bc); color: var(--bon); border-bottom: 4px solid var(--bc2); border-radius: 6px;
  box-shadow: 0 10px 30px rgb(0 0 0 / 0.5); pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden;
}
.cx-banner b { font-weight: 800; font-size: clamp(16px, 5vw, 26px); text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cx-banner.big b { font-size: clamp(22px, 7vw, 38px); }
.cx-banner span { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.9; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cx-banner.show { animation: cx-ban 0.4s cubic-bezier(0.2, 1.4, 0.4, 1); }
.cx-banner.rec { border-bottom-color: #FACC15; }

.cx-b { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; min-width: 44px; padding: 0 10px; border-radius: 999px; background: #1C2421; color: #E7ECE9; font-weight: 700; font-size: 13px; white-space: nowrap; }
.cx-b svg { width: 18px; height: 18px; flex: none; }
.cx-b.wide { flex: 1; min-width: 0; }
.cx-b.wide span { overflow: hidden; text-overflow: ellipsis; }

.cx-feed-h { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--cx-mute); padding: 12px 0 6px; }

.cx-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 26px var(--s2) calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, #0E1115 40%); }
.cx-foot.gx-done { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); padding-bottom: 10px; background: linear-gradient(transparent, #0E1115 45%); }
.cx-continue {
  display: block; width: 100%; max-width: 560px; margin: 0 auto; min-height: 54px; border-radius: 10px; background: #22C55E; color: #04140A;
  font-weight: 800; font-size: var(--fs-md); letter-spacing: 0.06em; text-transform: uppercase; text-align: center;
  box-shadow: 0 6px 18px rgb(34 197 94 / 0.3);
}
.cx-fin { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }
.cx-res { font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; letter-spacing: -0.01em; text-align: center; }
.cx-res.w { color: #4ADE80; }
.cx-res.l { color: #F87171; }
.cx-fin-t { text-align: center; color: #C7D0CB; font-size: var(--fs-sm); overflow-wrap: anywhere; }
.cx-ls { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--cx-card); border-radius: 10px; overflow: hidden; }
.cx-ls th { font-size: 10.5px; color: var(--cx-mute); font-weight: 800; padding: 7px 6px; text-align: center; }
.cx-ls td { padding: 8px 6px; text-align: center; border-top: 1px solid var(--cx-rule); }
.cx-ls td:first-child, .cx-ls th:first-child { text-align: left; padding-left: 10px; white-space: nowrap; font-weight: 800; }
.cx-lds { display: flex; flex-direction: column; gap: 4px; }
.cx-ld-h { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--cx-mute); padding-top: 4px; }
.cx-ld-r { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s1); }
.cx-ld { display: flex; gap: var(--s1); align-items: center; background: var(--cx-card); border-radius: 10px; padding: 8px; text-align: left; min-width: 0; }
.cx-ld .av { background: #222B27; }
.cx-ld-m { display: flex; flex-direction: column; min-width: 0; font-size: var(--fs-xs); color: #C7D0CB; line-height: 1.3; }
.cx-ld-m b { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-ld-m span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-box { align-self: center; color: #FACC15; font-weight: 800; font-size: var(--fs-sm); padding: 10px; }

/* live stats (inside the gamecast) */
.cx-stats { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.cx-stats .tbl { font-size: var(--fs-xs); }
.cx-stats .tbl th { color: var(--cx-mute); border-bottom-color: var(--cx-rule); }
.cx-stats .tbl td { border-bottom-color: var(--cx-rule); color: #E7ECE9; }
.cx-stats .tbl .num { color: #E7ECE9; }
.cx-stats .tbl .sticky { background: #0B0F0D; box-shadow: 1px 0 0 var(--cx-rule); max-width: 38vw; }
.cx-stats .tbl-wrap { margin-inline: -10px; padding-inline: 10px; }
.cx-stats .tbl.even tbody tr:nth-child(even) td { background: rgb(255 255 255 / 0.035); }
.cx-stats .tbl.even tbody tr:nth-child(even) td.sticky { background: #121714; }
.cx-stats .box-h { color: #C7D0CB; }
.cx-stats .empty { color: var(--cx-mute); }
.cmpb { display: flex; flex-direction: column; gap: 10px; }
.cmpb-h { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--s1); align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cx-mute); }
.cmpb-h span:first-child { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmpb-h span:last-child { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmpb-r { display: grid; grid-template-columns: 1fr; gap: 4px; }
.cmpb-t { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--s1); align-items: baseline; font-size: 13px; font-variant-numeric: tabular-nums; }
.cmpb-t b { font-weight: 800; white-space: nowrap; }
.cmpb-t b:last-child { text-align: right; }
.cmpb-t span { color: var(--cx-mute); font-size: 11px; font-weight: 700; text-align: center; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmpb-b { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #222B27; gap: 2px; }
.cmpb-b i { display: block; height: 100%; transition: width 0.4s ease; }
.cmpb-b i:first-child { border-radius: 4px 0 0 4px; }
.cmpb-b i:last-child { border-radius: 0 4px 4px 0; }
.cmpb.light .cmpb-b { background: var(--sunk); }
.cmpb.light .cmpb-t span, .cmpb.light .cmpb-h { color: var(--ink-3); }

/* ---------- weekly recap ---------- */
#overlay-host { position: fixed; inset: 0; z-index: 46; }
.rc { position: absolute; inset: 0; background: #000; color: #EDEDED; display: flex; flex-direction: column; }
.rc-in { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; width: 100%; max-width: 760px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 14px calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.rc-head { display: flex; flex-direction: column; gap: 2px; }
.rc-eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: #E7B84A; }
.rc-title { font-weight: 800; font-size: var(--fs-xl); line-height: 1.05; text-transform: uppercase; letter-spacing: -0.02em; }
.rc-rec { font-size: 13px; color: #A3A3A3; }
.rc-game { display: flex; flex-direction: column; gap: var(--s1); background: #1A1A1A; border-radius: 12px; padding: 12px 14px; border-top: 4px solid #4ADE80; text-align: left; width: 100%; }
.rc-game.l { border-top-color: #F87171; }
.rc-tag { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4ADE80; }
.rc-game.l .rc-tag { color: #F87171; }
.rc-sc { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--s1); }
.rc-side { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #A3A3A3; min-width: 0; }
.rc-side.me { color: #fff; }
.rc-n { font-weight: 800; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.rc-rk { font-size: 11px; color: #737373; margin-right: 3px; }
.rc-s { font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.rc-at { color: #737373; font-weight: 700; font-size: var(--fs-xs); }
.rc-link { font-size: 13px; font-weight: 800; color: #FACC15; align-self: center; }
.rc-h { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: #D4D4D4; padding: 10px 0 4px; border-bottom: 1px solid #262626; }
.potws { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.potw { display: flex; flex-direction: column; background: #262626; border-radius: 10px; overflow: hidden; text-align: left; width: 100%; color: #EDEDED; }
.potw-h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s1); padding: 10px 12px 8px; }
.potw-h b { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.potw-h span { font-size: 11px; font-weight: 800; color: #A3A3A3; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
.potw-b { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 0 12px 12px; align-items: start; }
.potw-av { width: 84px; height: 84px; display: block; }
.potw-st { display: flex; flex-direction: column; min-width: 0; }
.potw-l { font-size: 11px; font-weight: 800; color: #A3A3A3; text-transform: uppercase; letter-spacing: 0.05em; }
.potw-v { font-size: var(--fs-sm); font-weight: 700; color: #fff; margin-bottom: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.potw-g { font-size: var(--fs-xs); color: #A3A3A3; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-poll { list-style: none; margin: 0; padding: 0; }
.rc-poll li { display: grid; grid-template-columns: 22px auto minmax(0, 1fr) auto 36px; gap: var(--s1); align-items: center; padding: 7px 0; border-bottom: 1px solid #1F1F1F; font-size: var(--fs-sm); }
.rc-poll li.me { background: rgb(231 184 74 / 0.12); }
.rc-pn { font-weight: 800; text-align: center; color: #D4D4D4; font-variant-numeric: tabular-nums; }
.rc-pt { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-pr { color: #A3A3A3; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rc-mv { font-size: 11px; font-weight: 800; color: #737373; text-align: right; white-space: nowrap; }
.rc-mv.up { color: #4ADE80; }
.rc-mv.down { color: #F87171; }
.rc-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px var(--s2) calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, #000 45%); display: flex; gap: 10px; align-items: center; justify-content: center; }
.rc-foot .cx-continue { max-width: 560px; }

/* season in review */
.rc-game.gold { border-top-color: #E7B84A; }
.rc-game.gold .rc-tag { color: #E7B84A; }
.rc-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rc-stat { display: flex; flex-direction: column; gap: 2px; background: #262626; border-radius: 8px; padding: 8px 6px; min-width: 0; text-align: center; }
.rc-stat span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 800; color: #A3A3A3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-stat b { font-size: var(--fs-md); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rc-stat small { font-size: 11px; color: #4ADE80; font-weight: 700; }
.rc-link-m { font-size: 13px; font-weight: 800; color: #FACC15; }
.rc-honors { color: #EDEDED; }
.rc-next { font-size: 13px; color: #A3A3A3; text-align: center; padding: 8px 0; }
.rc-foot-2 { display: flex; gap: 10px; align-items: center; max-width: 560px; margin: 0 auto; }
.rc-foot-2 .cx-continue { flex: 1; }
.rc-share { flex: none; min-height: 54px; padding: 0 16px; background: #262626; }

/* ---------- injuries, records, hall of fame, game logs ---------- */
.inj-row .row-s { white-space: normal; }
.rec-r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1); align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); width: 100%; text-align: left; }
.rec-l { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-n { font-weight: 700; font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-s { font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec-v { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-align: right; white-space: nowrap; }
.rec-v small { font-size: 11px; font-weight: 700; color: var(--ink-3); margin-left: 3px; letter-spacing: 0; }
/* Hall of Fame rows: portrait + points · name/years/class · accolades/stat line/teams */
.hof-pos { padding: 14px var(--s2) 6px; margin-inline: calc(-1 * var(--s2)); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--ink); border-bottom: 1px solid var(--rule); }
.hof-r { display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1.25fr); gap: 10px; align-items: center; padding: 8px var(--s2); min-height: 84px; width: 100%; text-align: left; }
.hof-av { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.hof-pts { font-size: 11px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hof-l, .hof-rt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hof-n { font-size: var(--fs-sm); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hof-s { font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hof-acc { font-size: 12px; font-weight: 700; color: var(--gold); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hof-st { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hof-tm { font-size: 11px; color: var(--ink-3); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hof-meter { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: var(--s1); align-items: center; }
.hof-meter b { text-align: right; font-variant-numeric: tabular-nums; }
.hof-parts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.hof-parts li { display: flex; justify-content: space-between; gap: var(--s1); }
.hof-parts li span { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hof-parts li b { white-space: nowrap; font-variant-numeric: tabular-nums; }
.hof-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--gold); color: #1a1300; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; white-space: nowrap; }

/* ---------- feedback ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; max-width: min(92vw, 520px);
  background: var(--ink); color: var(--bg); padding: 11px var(--s2); border-radius: 12px; font-size: var(--fs-sm); font-weight: 600;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.25); transition: opacity 0.2s, transform 0.2s; overflow-wrap: anywhere;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
body:has(.pm) .toast { bottom: auto; top: calc(72px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px); }
body:has(.pm) .toast.show { transform: translate(-50%, 0); }
.toast.good { background: var(--win); color: #fff; }
.toast.bad { background: var(--loss); color: #fff; }
.busy { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.busy-card { display: flex; flex-direction: column; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 22px 26px; font-weight: 700; max-width: 80vw; text-align: center; }
.boot { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--ink-2); }
.ball {
  width: 38px; height: 22px; border-radius: 50%; background: #7B4A22; position: relative; display: block;
  animation: spin 0.9s linear infinite; box-shadow: inset -3px -3px 0 rgb(0 0 0 / 0.2);
}
.ball::before { content: ''; position: absolute; left: 11px; right: 11px; top: 10px; height: 2px; background: #fff; border-radius: 1px; }
.ball::after { content: ''; position: absolute; left: 14px; right: 14px; top: 7px; height: 8px; background: repeating-linear-gradient(90deg, #fff 0 1.5px, transparent 1.5px 4px); }

/* ---------- motion: 150-250ms, nothing pops ---------- */
.view > .wrap.enter { animation: view-in var(--dur) var(--ease); }
.btn, .chip, .tab, .tabs-b, .seg-b, .qa, .mini, .act-b, .tile, .nil-b, .arch { transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 120ms ease, box-shadow 150ms ease; }
.btn:active, .chip:active, .qa:active, .mini:active, .act-b:active, .nil-b:active, .play-b:active, .cx-b:active { transform: scale(0.97); }
.row:active, .srow:active, .menu-i:active, .news-r:active, .hof-r:active, .rec-r:active, .sched:active, .sb[data-act]:active, .poll-r:active, .potw:active { background-color: var(--sunk); }
.tab:active svg { transform: scale(0.92); }
.tab svg { transition: transform 120ms ease; }
.tabs-b { position: relative; }
.toast { transition: opacity 200ms ease, transform 200ms var(--ease); }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { transform: translateY(40px); opacity: 0.6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes cx-blink { 50% { opacity: 0.25; } }
@keyframes cx-pop { 0% { transform: scale(1); } 30% { transform: scale(1.35); color: #FDE68A; } 100% { transform: scale(1); } }
@keyframes cx-ban { from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
@keyframes cx-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

@media (min-width: 700px) {
