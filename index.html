/* log cards */
.gx-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 8px 10px calc(96px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; background: #0E1115; }
.gx-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.gx-card { background: #1C2026; border-radius: 6px; overflow: hidden; box-shadow: inset 3px 0 0 var(--c, #2A2F37); animation: cx-in 0.3s ease-out; }
.gx-card-h { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; background: #262B32; font-size: 13px; font-weight: 700; color: #D8DEE5; font-variant-numeric: tabular-nums; }
.gx-card-h span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.gx-card-h span:last-child { white-space: nowrap; color: #C7CED6; }
.gx-card-b { display: grid; grid-template-columns: 78px minmax(0, 1fr) 84px; gap: 8px; align-items: center; padding: 10px 10px 8px; }
.gx-card-p { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.gx-card-p .av.sm { width: 48px; height: 48px; }
.gx-who { font-size: 11px; color: #C7CED6; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.gx-card-x { font-size: 14px; line-height: 1.4; color: #EEF1F4; overflow-wrap: anywhere; }
.gx-card-r { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 3px; font-variant-numeric: tabular-nums; }
.gx-card-r b { font-size: 15px; font-weight: 800; }
.gx-card-r span { font-size: 12px; font-weight: 700; color: #C7CED6; letter-spacing: 0.02em; }
.gx-card-f { padding: 0 12px 10px; font-size: 12px; color: #B6BEC7; font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.gx-card.sc .gx-card-r b, .gx-card.sc .gx-card-r span { color: #FFE14D; }
.gx-card.big .gx-card-r span { color: #FCA5A5; }

@media (max-width: 374px) {

  .gx-ctrl { justify-content: center; }
  .gx-b { width: 40px; height: 40px; }
  .gx-pause { width: 46px; height: 46px; }
  .gx-tab { font-size: 13px; min-height: 36px; }

}

.cx-banner {

}

.cx-drive { font-size: 11px; color: var(--cx-mute); min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-ctrl { display: flex; gap: 6px; align-items: center; padding-bottom: var(--s1); }

.cx-fin { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }

/* live stats (inside the gamecast) */

.cmpb { display: flex; flex-direction: column; gap: 10px; }

.cmpb-t { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--s1); align-items: baseline; font-size: 13px; font-variant-numeric: tabular-nums; }
.cmpb-t b { font-weight: 800; white-space: nowrap; }

.cmpb-b { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #222B27; gap: 2px; }

/* ---------- weekly recap ---------- */
#overlay-host { position: fixed; inset: 0; z-index: 46; }
.rc { position: absolute; inset: 0; background: #000; color: #EDEDED; display: flex; flex-direction: column; }
.rc-in { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; width: 100%; max-width: 760px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 14px calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.rc-head { display: flex; flex-direction: column; gap: 2px; }

.rc-poll { list-style: none; margin: 0; padding: 0; }

/* season in review */

.rc-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rc-stat { display: flex; flex-direction: column; gap: 2px; background: #262626; border-radius: 8px; padding: 8px 6px; min-width: 0; text-align: center; }
.rc-stat span { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 800; color: #A3A3A3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Hall of Fame rows: portrait + points · name/years/class · accolades/stat line/teams */
.hof-pos { padding: 14px var(--s2) 6px; margin-inline: calc(-1 * var(--s2)); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--ink); border-bottom: 1px solid var(--rule); }

/* ---------- feedback ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 70;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; max-width: min(92vw, 520px);
